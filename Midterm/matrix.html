<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Matrix</title>
</head>
<body>
	<table>
		<thead></thead>
		<tbody></tbody>
	</table>
	<script>
		const NUM_ROWS = 30, NUM_COLS = 40, PULL_THRESHOLD = 20;
		const matrix = Array.from({ length: NUM_ROWS }, () =>
			Array.from({ length: NUM_COLS }, () => Math.floor(Math.random() * 100)));	// 0-99 matrix[row][col]
        
        // save a copy of the prginal tsble for reseting
        const originalMatrix = matrix.map((row) => [...row]);

		const thead = document.querySelector("thead");
		const tbody = document.querySelector("tbody");

		const headerRow = thead.insertRow();
		headerRow.insertCell().outerHTML = "<th></th>";
		for (let col = 0; col < NUM_COLS; col++) {
			const th = document.createElement("th");
			th.textContent = "Col" + (col + 1);
			th.addEventListener("pointerdown", (event) => startPull(event, th, col));
			headerRow.append(th);
		}

		const rowElements = matrix.map((values, row) => {
			const tr = tbody.insertRow();
			const label = document.createElement("th");
			label.textContent = "Row" + (row + 1);
			tr.append(label);
			values.forEach((value) => {
				const td = tr.insertCell();
				td.textContent = value;
				td.style.background = `hsl(210, 70%, ${95 - value * 0.5}%)`;
			});
			return tr;
		});

		function sortRowsByColumn(col, direction) {
			const order = matrix.map((_, row) => row).sort((a, b) => direction * (matrix[a][col] - matrix[b][col]) || a - b);	//Direction 1 ascending, -1 descending
			tbody.append(...order.map((row) => rowElements[row]));
		}

		function startPull(event, th, col) {
			const startY = event.clientY;
			let lastDirection = 0;
			th.setPointerCapture(event.pointerId);

			th.onpointermove = (moveEvent) => {
				const pull = moveEvent.clientY - startY;
				const direction = pull > PULL_THRESHOLD ? 1 : pull < -PULL_THRESHOLD ? -1 : 0;	//Direction 1 ascending (pull down), -1 descending (pull up), 0 (pull nowhere or left/right)
				if (direction !== 0 && direction !== lastDirection) {	//If cursor is moved enough pixels and in a different direction than already set
					lastDirection = direction;
					sortRowsByColumn(col, direction);
				}
			};
			th.onpointerup = () => { th.onpointermove = null; th.onpointerup = null; };	//Clean after letting go
		}

        // add keyboard functionality 

        function refreshTableDOM() {
            matrix.forEach((values, row) => {
                const tr = rowElements[row];
                const tds = tr.querySelectorAll("td");
                values.forEach((value, col) => {
                    tds[col].textContent = value;
                    tds[col].style.background = `hsl(210, 70%, ${95 - value * 0.5}%)`;
                });
            });
        }

        function sortAllColumns(direction) {
            for (let c = 0; c < NUM_COLS; c++) {
                const colValues = matrix.map(row => row[c]).sort((a, b) => direction * (a - b));
                matrix.forEach((row, r) => { row[c] = colValues[r]; });
            }
            refreshTableDOM();
        }

        function sortAllRows(direction) {
            matrix.forEach(row => {
                row.sort((a, b) => direction * (a - b));
            });
            refreshTableDOM();
        }

        function sortAll(direction) {
            const allValues = matrix.flat().sort((a, b) => direction * (a - b));
            let index = 0;
            for (let r = 0; r < NUM_ROWS; r++) {
                for (let c = 0; c < NUM_COLS; c++) {
                    matrix[r][c] = allValues[index++];
                }
            }
            const originalOrder = Array.from({ length: NUM_ROWS }, (_, i) => i);
            tbody.append(...originalOrder.map((row) => rowElements[row]));
            refreshTableDOM();
        }

        function resetTable() {
            for (let r = 0; r < NUM_ROWS; r++) {
                for (let c = 0; c < NUM_COLS; c++) {
                    matrix[r][c] = originalMatrix[r][c];
                }
            }
            const originalOrder = Array.from({ length: NUM_ROWS }, (_, i) => i);
            tbody.append(...originalOrder.map((row) => rowElements[row]));
            refreshTableDOM();
        }

        // keyboard listener
        document.addEventListener("keydown", (event) => {
            switch (event.key) {
                case "ArrowUp":
                    sortAllColumns(1);
                    break;
                case "ArrowDown":
                    sortAllColumns(-1);
                    break;
                case "ArrowLeft":
                    sortAllRows(-1);
                    break;
                case "ArrowRight":
                    sortAllRows(1);
                    break;
                case "a":
                    sortAll(1);
                    break;
                case "d":
                    sortAll(-1);
                    break;
                case "Escape":
                    resetTable();
                    break;
            }
        });


	</script>
</body>
</html>
